[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "portaria"
version = "0.2.0"
description = "Face recognition at the staff entrance: recognition service, database and web UI (MVP)."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "alembic>=1.13",
    "fastapi>=0.110",
    "itsdangerous>=2.1",
    "jinja2>=3.1",
    "numpy>=1.26",
    "onnxruntime>=1.20",
    "opencv-python>=4.10",
    "python-multipart>=0.0.9",
    "sqlalchemy>=2.0",
    "uvicorn>=0.29",
]

[project.optional-dependencies]
dev = ["httpx>=0.27", "pytest>=8"]

[project.scripts]
portaria = "portaria.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
portaria = [
    "i18n/*.json",
    "migrations/*.py",
    "migrations/*.mako",
    "migrations/versions/*.py",
    "web/templates/*.html",
    "web/static/*",
    "web/static/fonts/*",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
