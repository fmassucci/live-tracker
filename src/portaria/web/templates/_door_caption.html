{# Chips over the live image: whether the door camera is recording, and its name. Refreshed in place on Today. #}
{% from "_macros.html" import camera_chip %}
<div class="video-chips" id="door-caption" {% if oob %}hx-swap-oob="true"{% endif %}>
  {% if door_camera %}
  {{ camera_chip(door_state, t(recording_states[door_state]), "glass") }}
  <span class="glass">{{ door_camera.name }}</span>
  {% endif %}
</div>
